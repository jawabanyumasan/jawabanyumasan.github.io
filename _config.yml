title: "Jawa Banyumasan"
tagline: "Ora Ngapak Ora Kepenak"
description: "Ulasan bisnis dan usaha di sekitar Keresidenan Jawa Banyumasan meliputi Banyumas, Purbalingga, Banjarnegara, Cilacap, dan Kebumen."
author: "Wahyudi"
email: "jawabanyumasan@gmail.com"

# ====== PENTING: URL & BASEURL ======
url: "https://jawabanyumasan.github.io"
baseurl: ""

# ---------- Build Settings ----------
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/
timezone: Asia/Jakarta

kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# ---------- Pagination ----------
paginate: 6
paginate_path: "/page/:num/"

# ---------- Plugins ----------
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# ---------- SEO Defaults ----------
lang: id_ID
logo: "/assets/images/logo.png"

twitter:
  username: blogjak
  card: summary_large_image

social:
  name: Blogjak Theme
  github: "https://github.com/jawabanyumasan"
  facebook: "https://facebook.com/jawabanyumasan"
  instagram: "https://instagram.com/jawabanyumasan"
  youtube: ""
  linkedin: ""
  tiktok: "https://tiktok.com/@jawabanyumasan"
  telegram: ""
  whatsapp: ""
  pinterest: ""
  reddit: ""
  discord: ""
  medium: ""
  devto: ""
  rss: "/feed.xml"                            # otomatis dari jekyll-feed

# ---------- Search ----------
search:
  enabled: true
  placeholder: "Cari artikel..."
  max_results: 10
  excerpt_length: 150

# ---------- Related Posts ----------
related:
  enabled: true
  count: 3
  strategy: categories   # options: categories, tags, both

# ---------- Defaults ----------
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      sitemap: true
  - scope:
      path: ""
    values:
      layout: "default"

# ---------- Exclude ----------
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
