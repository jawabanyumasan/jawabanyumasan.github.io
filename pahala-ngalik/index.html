<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transliterasi Teks ke Aksara</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Transliterasi Aksara</h1>
            <div class="top-controls">
                <button id="darkModeToggle" class="btn-toggle">🌙 Dark Mode</button>
            </div>
        </header>

        <div class="editor-section">
            <!-- Form Input Latin -->
            <div class="input-group">
                <label for="inputText">Ketik Teks Latin (Multi Paragraf):</label>
                <textarea id="inputText" placeholder="Ketik di sini... (misal: aksara 123, pa, pi?)"></textarea>
            </div>

            <!-- Area Tampilan Hasil -->
            <div class="output-group">
                <label>Hasil Aksara (RTL):</label>
                
                <!-- Pengatur Ukuran Gambar -->
                <div class="size-control">
                    <span>Ukuran Gambar:</span>
                    <input type="range" id="imgSizeSlider" min="16" max="64" value="28">
                    <span id="sizeValue">28px</span>
                </div>

                <!-- Container Hasil RTL -->
                <div id="outputArea" class="output-area"></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p id="footerText">Created By Wahyudi</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
