<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pahala Ngalik - Galeri Aksara</title>
    
    <!-- Memanggil CSS Terpisah -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Galeri Aksara</h1>

        <!-- Filter & Pencarian -->
        <div class="filter-container">
            <div class="filter-group">
                <label for="filterAksara">Aksara:</label>
                <select id="filterAksara">
                    <option value="all">Semua Aksara</option>
                </select>
            </div>

            <div class="filter-group">
                <input type="text" id="searchInput" placeholder="Cari pola (misal: pa, pi, pang)...">
            </div>
        </div>

        <!-- Tempat Gambar Tampil -->
        <div class="grid" id="imageGrid"></div>
    </div>

    <!-- Memanggil JS Terpisah -->
    <script src="app.js"></script>
</body>
</html>
